<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>JYparalegal</title>
    <script>
      // 首屏同步应用上次缓存的主题,消除运行时切换导致的闪白(见 App.tsx 主题 effect)。
      (function () {
        try {
          var mode = localStorage.getItem('jy.theme');
          if (mode === 'dark' || mode === 'light') {
            document.documentElement.classList.add(mode);
          }
        } catch (e) { /* 忽略:隐私模式或存储不可用 */ }
      })();
    </script>
    <script>
      // crypto.randomUUID is only available in secure contexts (HTTPS/localhost);
      // polyfill via getRandomValues so plain-HTTP deployments keep working.
      if (window.crypto && !window.crypto.randomUUID) {
        window.crypto.randomUUID = function () {
          var b = crypto.getRandomValues(new Uint8Array(16));
          b[6] = (b[6] & 0x0f) | 0x40;
          b[8] = (b[8] & 0x3f) | 0x80;
          var h = Array.from(b, function (x) {
            return x.toString(16).padStart(2, '0');
          }).join('');
          return (
            h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' +
            h.slice(16, 20) + '-' + h.slice(20)
          );
        };
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Inline loading placeholder shown before JS bundle loads -->
      <style>
        .app-init-loading {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          gap: 2rem;
          background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 50%, #faf5ff 100%);
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .app-init-loading-brand {
          display: flex;
          align-items: center;
          gap: 1rem;
        }
        .app-init-loading-logo {
          width: 4rem;
          height: 4rem;
          border-radius: 1rem;
          background: linear-gradient(135deg, #2563eb, #3b82f6, #9333ea);
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.3);
        }
        .app-init-loading-logo span {
          color: white;
          font-weight: 700;
          font-size: 1.875rem;
          letter-spacing: -0.025em;
        }
        .app-init-loading-title {
          font-size: 1.5rem;
          font-weight: 700;
          background: linear-gradient(to right, #2563eb, #9333ea);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .app-init-loading-subtitle {
          font-size: 0.875rem;
          color: #64748b;
          margin-top: 0.125rem;
        }
        .app-init-loading-dots {
          display: flex;
          align-items: center;
          gap: 0.5rem;
        }
        .app-init-loading-dot {
          width: 0.625rem;
          height: 0.625rem;
          border-radius: 50%;
          background: linear-gradient(135deg, #3b82f6, #9333ea);
          animation: init-dot-bounce 1.4s ease-in-out infinite;
        }
        .app-init-loading-dot:nth-child(2) {
          animation-delay: 0.16s;
        }
        .app-init-loading-dot:nth-child(3) {
          animation-delay: 0.32s;
        }
        @keyframes init-dot-bounce {
          0%, 80%, 100% {
            transform: scale(0.6);
            opacity: 0.4;
          }
          40% {
            transform: scale(1);
            opacity: 1;
          }
        }
        .app-init-loading-text {
          text-align: center;
        }
        .app-init-loading-text p:first-child {
          font-size: 1rem;
          font-weight: 500;
          color: #334155;
          margin-bottom: 0.5rem;
        }
        .app-init-loading-text p:last-child {
          font-size: 0.875rem;
          color: #64748b;
        }
        @media (prefers-color-scheme: dark) {
          .app-init-loading {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16162a 100%);
          }
          .app-init-loading-subtitle {
            color: #94a3b8;
          }
          .app-init-loading-title {
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
          }
          .app-init-loading-text p:first-child {
            color: #e2e8f0;
          }
          .app-init-loading-text p:last-child {
            color: #94a3b8;
          }
        }
      </style>
      <div class="app-init-loading">
        <div class="app-init-loading-brand">
          <div class="app-init-loading-logo">
            <span>GP</span>
          </div>
          <div>
            <div class="app-init-loading-title">JYparalegal</div>
            <div class="app-init-loading-subtitle">给中国法律人用的 AI 合同工作台</div>
          </div>
        </div>
        <div class="app-init-loading-dots">
          <div class="app-init-loading-dot"></div>
          <div class="app-init-loading-dot"></div>
          <div class="app-init-loading-dot"></div>
        </div>
        <div class="app-init-loading-text">
          <p>正在配置环境...</p>
          <p>首次加载可能需要片刻时间</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
