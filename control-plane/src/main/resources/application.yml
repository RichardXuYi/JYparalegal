server:
  port: 8281

spring:
  application:
    name: jy-control-plane

# ==================== e签宝 SaaS API V3 ====================
cp:
  esign:
    # 沙箱环境域名
    host: https://smlopenapi.esign.cn
    # 应用凭证：必须由环境变量注入，严禁明文入库（原明文默认值已移除；该密钥曾入库，建议轮换）
    app-id: ${ESIGN_APP_ID:}
    app-secret: ${ESIGN_APP_SECRET:}

  # DP 服务账号（CP 自己的认证，与 e签宝无关）
  auth:
    service-username: ${CP_SERVICE_USERNAME:cp-service}
    # 不再内置弱默认口令；必须由环境变量注入（见 CpSecretGuard 启动校验）。
    service-password: ${CP_SERVICE_PASSWORD:}

  # JWT 签发配置
  jwt:
    # passport 用 RS256 签发：私钥永不出 CP，DP 只拿公钥（/cp/.well-known/jwks.json）验签。
    # 留空 private-key 时首次启动在 cp.data.dir 生成并持久化 jwt-private.pem/jwt-public.pem；
    # 多实例必须显式注入同一份 PEM，否则各实例密钥不同、跨实例验签失败。
    issuer: ${CP_JWT_ISSUER:https://cp.jyparalegal.local}
    # 必须与 DP 的 jy.cp.instance-id 拼出的 dp:<instanceId> 一致（DP 校验 aud）。
    audience: ${CP_JWT_AUDIENCE:dp:dp-dev-01}
    # 服务账号票所代表的租户 id
    passport-tenant-id: ${CP_PASSPORT_TENANT_ID:1}
    expires-in: 900
    rsa:
      private-key: ${CP_JWT_RSA_PRIVATE_KEY:}
      private-key-path: ${CP_JWT_RSA_PRIVATE_KEY_PATH:}
      public-key-path: ${CP_JWT_RSA_PUBLIC_KEY_PATH:}

  # 运行时状态目录（当前存放自动生成的签名密钥）。多实例/容器需挂持久卷。
  data:
    dir: ${CP_DATA_DIR:}

  # DP 回调转发配置
  dp:
    base-url: ${DP_BASE_URL:http://localhost:8181}
    callback-token: ${CP_ESIGN_CALLBACK_TOKEN:}

logging:
  level:
    com.jyfc.cp: DEBUG
