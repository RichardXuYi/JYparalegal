version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: jy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: jy_financial
      MYSQL_USER: jy_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
    ports:
      - "13390:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: jy-redis
    restart: unless-stopped
    ports:
      - "16380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  qdrant:
    image: qdrant/qdrant:latest
    container_name: jy-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jy-backend
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jy_financial?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: jy_app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-app_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis

  studio-web:
    build:
      context: .
      dockerfile: studio-web/Dockerfile
    container_name: jy-studio-web
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      PORT: 8788
      DATA_DIR: /data
      BACKEND_URL: http://backend:8181
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    volumes:
      - studio_web_data:/data
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  studio_web_data:
