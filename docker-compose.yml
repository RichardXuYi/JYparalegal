version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: jy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: jy_financial
      MYSQL_USER: jy_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
    ports:
      - "13390:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: jy-redis
    restart: unless-stopped
    ports:
      - "16380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  qdrant:
    image: qdrant/qdrant:latest
    container_name: jy-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jy-backend
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      # 本 compose 面向本地开发：默认 dev profile（跳过生产强校验），可用
      # SPRING_PROFILES_ACTIVE=prod 覆盖。生产部署必须注入 prod + 真实密钥 + TLS，
      # 并单独编排 control-plane 服务（此处未含 CP，故默认 CP_MODE=local）。
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CP_MODE: ${CP_MODE:-local}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jy_financial?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: jy_app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-app_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis

  studio-web:
    build:
      context: .
      dockerfile: studio-web/Dockerfile
    container_name: jy-studio-web
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      PORT: 8788
      DATA_DIR: /data
      BACKEND_URL: http://backend:8181
      # 强制显式注入（>=32 字符随机值）。移除原 change-me-in-production 弱兜底：
      # 它既短于 web env.ts 要求的 32 字符（会启动失败），又是仓库内已知值（可伪造 JWT）。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a random value of at least 32 chars}
    volumes:
      - studio_web_data:/data
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  studio_web_data:
