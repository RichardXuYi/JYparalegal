packages:
  - '.'
  - 'harness'

# Migrated from monorepo root (origin/holyshit) pnpm-workspace.yaml
overrides:
  isbinaryfile: '^5.0.0'
  # Ubuntu 20.04 glibc 2.31 < 2.32 required by rollup native binary; use WASM build
  rollup: 'npm:@rollup/wasm-node@^4.62.3'

blockExoticSubdeps: false

onlyBuiltDependencies:
  - '@discordjs/opus'
  - '@whiskeysockets/baileys'
  - electron
  - electron-winstaller
  - esbuild
  - koffi
  - node-llama-cpp
  - openclaw
  - protobufjs
  - sharp

# pnpm 11 build-script allowlist
allowBuilds:
  '@google/genai': true
  '@whiskeysockets/baileys': true
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  node-llama-cpp: true
  openclaw: true
  protobufjs: true
  sharp: true
  tree-sitter-bash: true

supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64

