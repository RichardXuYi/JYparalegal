spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/jy_financial?useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USER:jy_app}
    password: ${DB_PASSWORD:jy_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16380}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    clean-on-validation-error: false

# 本地引导账号默认关闭。需要时用环境变量打开，口令不得写进本文件。
# 对外服务使用 prod profile，不会加载本文件。
ADMIN_BOOTSTRAP_ENABLED: false
ADMIN_BOOTSTRAP_USERNAME: sssxuyi
ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:}
ADMIN_BOOTSTRAP_EMAIL: sssxuyi@example.com
ADMIN_BOOTSTRAP_FORCE: false

USER_BOOTSTRAP_ENABLED: false
USER_BOOTSTRAP_USERNAME: xuyi
USER_BOOTSTRAP_PASSWORD: ${USER_BOOTSTRAP_PASSWORD:}
USER_BOOTSTRAP_EMAIL: xuyi@example.com
USER_BOOTSTRAP_FORCE: false

USER_FULL_ACCESS_ENABLED: true
USER_FULL_ACCESS_USERNAME: xuyi

# 企业数据初始化默认关闭。打开时口令由 COMPANY_BOOTSTRAP_EMPLOYEE_PASSWORD 注入。
COMPANY_BOOTSTRAP_ENABLED: false
COMPANY_BOOTSTRAP_NAME: grandpoem
COMPANY_BOOTSTRAP_EMPLOYEE: diandian
COMPANY_BOOTSTRAP_EMPLOYEE_PASSWORD: ${COMPANY_BOOTSTRAP_EMPLOYEE_PASSWORD:}

logging:
  level:
    com.jyfc.backend.module.auth: DEBUG
    com.jyfc.backend.module.auth.service.UserService: DEBUG
    com.jyfc.backend.core.security: DEBUG

# JWT 开发密钥（仅本地开发使用，长度 >= 32；生产由 JWT_SECRET 环境变量注入）
jwt:
  secret: ${JWT_SECRET:dev-only-jwt-secret-not-for-production-32b+}

# 安全限流（开发环境放宽，便于多 agent 并发测试）
security:
  login:
    max-attempts-per-ip: 100   # 开发环境 100 次/窗口（生产环境默认 10 次）
    rate-limit-window: 15       # 窗口大小（分钟），与生产保持一致

# M-33: 开发环境 HTTP 下 Secure cookie 不会被设置，显式关闭
app:
  cookie:
    secure: false

# ==================== 第三方集成默认配置（D6/M3'/M2'） ====================
# 说明：以下键全部保持注释 = 走缺省沙箱/桩/降级通道；
# 生产值一律来自密钥管理（环境变量/Secret），严禁明文提交到仓库。

# --- 签章只走控制平面的 e签宝。回调令牌须与 CP 的 CP_ESIGN_CALLBACK_TOKEN 一致。
# jy.sign.callback-token 必须与 CP 的 CP_ESIGN_CALLBACK_TOKEN 一致，否则回调会被拒绝。
# jy:
#   sign:
#     callback-token: ${ESIGN_CALLBACK_TOKEN:}

# --- 语音 RTC 通道（VoiceAdapter）：stub=留痕骨架（缺省），trtc=腾讯云 TRTC 生产 ---
# jy:
#   voice:
#     provider: stub               # 生产切换为 trtc
#     trtc:
#       sdk-app-id: ${TRTC_SDK_APP_ID:0}   # 生产由 TRTC_SDK_APP_ID 密钥注入
#       secret-key: ${TRTC_SECRET_KEY:}    # UserSig 签名密钥，生产由 TRTC_SECRET_KEY 注入
#       rest-url: https://console.tim.qq.com
#       admin-identifier: admin

# --- LLM 审查通道（LlmReviewChannel）：api-key 为空 = 通道弃权（缺省），规则通道独立可用 ---
# jy:
#   llm:
#     base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
#     api-key: ${LLM_API_KEY:}     # 生产由 LLM_API_KEY 密钥注入（DashScope/OpenAI 兼容）
#     model: qwen3-max

# --- CP 强制点模式（D16）---
# required = 走 CP chokepoint → e签宝；local = 仅本地配额兜底；off = 关闭
jy:
  cp:
    mode: ${CP_MODE:required}
    base-url: ${CP_BASE_URL:http://localhost:8281}
    service-username: ${CP_SERVICE_USERNAME:cp-service}
    service-password: ${CP_SERVICE_PASSWORD:cp-secret}

# --- 签章回调令牌（须与 CP 的 cp.dp.callback-token 一致）---
  sign:
    callback-token: ${ESIGN_CALLBACK_TOKEN:dev-callback-token}
