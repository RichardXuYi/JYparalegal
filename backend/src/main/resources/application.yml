server:
  port: 8181
spring:
  application:
    name: jy-financial-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://localhost:13306/jy_financial?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false
    username: jy_app
    password: ${DB_PASSWORD:jy_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: localhost
      port: 16380
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    ignore-missing-migrations: false
    ignore-pending-migrations: true
    validate-on-migrate: true
  session:
    redis:
      namespace: jyfc:sessions
    timeout: 86400

logging:
  level:
    com.jyfc.backend: INFO
    org.springframework.web: INFO
    org.hibernate: WARN

# JWT 跨端认证 (studio 等使用 Bearer token；web/app 仍走 Session Cookie)
jwt:
  # BE-001: 不再内置弱默认密钥。生产必须通过 JWT_SECRET 注入长度 >= 32 的随机密钥，
  # 缺失/过弱时 ProductionConfigValidator 会在 prod profile 启动时 fail-fast；
  # 开发环境密钥见 application-dev.yml。
  secret: ${JWT_SECRET:}
  issuer: ${JWT_ISSUER:jy-financial}
  # access token 有效期(秒)，默认 2 小时
  access-ttl-seconds: ${JWT_ACCESS_TTL:7200}
  # refresh token 有效期(秒)，默认 30 天
  refresh-ttl-seconds: ${JWT_REFRESH_TTL:2592000}

# D16 控制平面（CP）集成（docs/08）。**默认关闭**，保持既有单部署行为不变。
# 打开后：DP 接受 CP 签发的 RS256 passport JWT（身份/租户以 CP 为权威），且"送签"经 CP chokepoint 扣配额。
jy:
  cp:
    # 三态强制点（D16 / docs/08）：required=送签必须过 CP 且 CP 不可达即失败（生产默认，fail-closed）；
    # local=DP 用 tenant_quota 本地兜底（honor-system，单机/演示）；off=不计量（仅测试）。
    mode: ${CP_MODE:required}
    base-url: ${CP_BASE_URL:http://localhost:8281}
    instance-id: ${CP_INSTANCE_ID:dp-dev-01}
    issuer: ${CP_ISSUER:https://cp.jyparalegal.local}
    service-username: ${CP_SERVICE_USERNAME:}
    service-password: ${CP_SERVICE_PASSWORD:}

# 支付通道配置（仅保留模拟通道，可端到端跑通，不涉及真实资金/密钥；
# 如需接入真实通道再恢复 alipay/wechat 密钥配置）
payment:
  provider: ${PAYMENT_PROVIDER:simulated}

# CORS 配置
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://127.0.0.1:*,http://101.96.206.254:*}

# Bootstrap test users on first startup (or force-reset if FORCE=true).
# Production should override *_PASSWORD via env vars and set *_ENABLED=false
# (so the migration INSERTs don't matter in prod).
# The V1 Flyway migration intentionally inserts users/admins with NULL
# password_hash so this bootstrapper is the single source of truth.
ADMIN_BOOTSTRAP_ENABLED: false
ADMIN_BOOTSTRAP_USERNAME: sssxuyi
ADMIN_BOOTSTRAP_PASSWORD: "123456"
ADMIN_BOOTSTRAP_EMAIL: sssxuyi@example.com
ADMIN_BOOTSTRAP_FORCE: false

USER_BOOTSTRAP_ENABLED: false
USER_BOOTSTRAP_USERNAME: xuyi
USER_BOOTSTRAP_PASSWORD: "123456"
USER_BOOTSTRAP_EMAIL: xuyi@example.com
USER_BOOTSTRAP_FORCE: false
