function focusContent(){const next=signatures.filter(s=>s.status==='pending').sort((a,b)=>a.date.localeCompare(b.date))[0];return next?`<h3>${esc(next.title)}</h3><p>请在 ${next.date} 前确认合同内容，<br>并完成你的签署。</p><button class="text-btn" data-action="open-sign" data-value="${next.id}">查看签署任务 ${I('arrow-right')}</button>`:`<h3>当前没有待你签署的合同</h3><p>所有个人签署待办已处理。<br>可以前往总览，查看团队进度。</p><button class="text-btn" data-page="overview">查看工作总览 ${I('arrow-right')}</button>`;}
function notificationContent(){const waiting=signatures.filter(s=>s.status==='pending');const pending=evidence.filter(e=>e.status==='pending');return `<p class="lead">提醒根据当前演示状态更新，不发送外部消息或邮件。</p>${waiting.map(s=>`<section class="notification-card"><h3>${esc(s.title)}等待你签署</h3><p>截止日期 ${s.date}，请先核实合同内容和签署权限。</p><button class="text-btn" data-action="open-sign" data-value="${s.id}">查看任务 ${I('arrow-right')}</button></section>`).join('')}${pending.map(e=>`<section class="notification-card"><h3>材料等待核验</h3><p>“${esc(e.name)}”已加入证据管理，请补充原始载体与来源记录。</p><button class="text-btn" data-action="evidence-detail" data-value="${e.id}">查看材料 ${I('arrow-right')}</button></section>`).join('')}${!waiting.length&&!pending.length?'<div class="empty">暂无待处理提醒</div>':''}`;}
function renderChat(){
if(state.chat)return renderConversation();
return `<div class="welcome"><div class="welcome-intro"><div class="hero-symbol">${logo}</div><h1>专业的事，交给专业的 AI。</h1><p>从一份合同，到每一次决策。你的法律助理，随时在这里。</p></div>${composer()}<div class="input-hint">Enter 发送 · Shift + Enter 换行</div><div class="starter-grid">${[['file','审查一份合同','识别风险，给出修改建议'],['pen','起草法律文书','从需求到一份专业初稿'],['shield','梳理案件证据','材料归档，构建证据目录'],['scale','准备庭审演练','梳理争点，预演攻防策略']].map((s,i)=>`<button class="starter" data-action="starter" data-value="${i}"><span class="starter-icon">${I(s[0])}</span>${I('arrow-up-right')}<strong>${s[1]}</strong><small>${s[2]}</small></button>`).join('')}</div><div class="recent-zone"><section><div class="section-head"><h2>继续你的工作</h2><button class="text-btn" data-action="all-chats">全部记录 ${I('arrow-right')}</button></div>${[['年度采购框架协议 · 风险审查','年度采购项目','今天 10:32','file'],['新员工劳动合同 · 起草初稿','日常法律顾问','昨天 16:45','pen'],['供应商履约材料 · 证据整理','年度采购项目','昨天 14:20','shield']].map((x,i)=>`<button class="recent-item" data-action="history" data-value="${i}"><span class="doc-icon ${i===1?'blue':i===2?'amber':''}">${I(x[3])}</span><div class="grow"><strong>${x[0]}</strong><small>${x[1]}<span style="margin:0 8px;color:#c6cec0">·</span>${x[2]}</small></div>${I('chevron')}</button>`).join('')}</section><aside class="focus-card"><div class="focus-label">${I('clock')}今日关注<span class="pill amber" style="font-size:9px;padding:2px 5px;margin-left:auto">${counts().pending} 项待签</span></div>${focusContent()}</aside></div><div class="welcome-footer"><span>${I('lock')}文件不会上传 · 本地交互演示</span><span>${I('shield')}AI 内容仅供参考，请专业复核</span></div></div>`;
}
function responseFor(prompt){if(/证据|材料归档/.test(prompt)&&!/审查/.test(prompt))return {type:'evidence',intro:'我将按“证明目的—材料来源—待补充项”整理这组示例材料。以下为证据目录的演示结构。',title:'年度采购项目 · 证据整理清单',items:[['合同关系','采购协议、补充协议与授权材料用于说明合同主体及约定内容。'],['履行情况','将付款凭证、交付记录与验收邮件按时间排序，并保留原始载体。'],['待补充材料','目前示例缺少完整验收签字页和邮件原始文件，应进一步收集。']],summary:'已整理 3 组材料',note:'1 项待补充 · 证明力需结合全案评估'};
if(/起草|保密|文书/.test(prompt))return {type:'draft',intro:'可以。为避免套用范本遗漏关键交易安排，我会先确认以下信息，再形成可供修改的初稿。下面是起草流程演示。',title:'法律文书 · 起草需求清单',items:[['主体与适用场景','确认各方名称、主体资格、合作目的，以及是否涉及关联方。'],['核心条款与商业条件','补充服务或保密范围、金额或期限、履行安排与责任边界。'],['审阅与最终确认','确定审阅立场、争议解决方式，并由有权限的人员确认最终文本。']],summary:'起草前需确认 3 项信息',note:'当前展示需求清单 · 并非正式合同'};
if(/庭审|争议焦点/.test(prompt))return {type:'court',intro:'先把案件拆成清晰的事实与争点，再进入庭审。以下是基于采购合同纠纷示例的准备框架，不预测真实裁判结果。',title:'采购合同纠纷 · 庭前准备提纲',items:[['形成时间线','整理签订、交付、验收、付款和催告节点，区分已证事实与争议事实。'],['识别核心争点','围绕履行是否符合约定、验收条件是否成就以及违约损失展开准备。'],['安排举证与质证','为每个主张关联材料，准备对证据真实性、关联性与证明目的的说明。']],summary:'庭前准备已分为 3 个阶段',note:'进入模拟法庭后可逐步演练'};
return {type:'review',intro:'我已按甲方视角整理这份示例采购协议的审查重点。建议在签署前优先确认以下 3 项，并与对方协商具体修改。',title:'年度采购框架协议 · 审查意见',items:[['付款条件缺少验收前提','示例第 4 条仅约定交货后付款，建议补充“完成验收且收到合法有效发票”作为付款条件。'],['验收标准与异议期限不明确','示例第 5 条未明确质量标准和异议方式，建议补充附件标准、验收期限及书面通知机制。'],['违约责任与救济安排不完整','示例第 8 条未清晰约定逾期交付救济，建议结合实际损失、交易背景协商责任与解除条件。']],summary:'3 项需要重点关注',note:'2 项高优先级 · 1 项一般建议'};}
function renderConversation(){const current=state.messages[state.activeArtifact]||state.messages[state.messages.length-1]||{prompt:starterPrompts[0]};const r=responseFor(current.prompt);return `<div class="chat-layout ${state.artifact?'show-artifact':''}"><section class="conversation"><div class="chat-scroll"><div class="chat-messages">${state.messages.map((m,index)=>{const a=responseFor(m.prompt);return `<div class="user-message"><div class="user-bubble">${esc(m.prompt)}</div><span class="avatar">林</span></div><div class="assistant-label"><span class="brand-mark">${logo}</span><b>JY 法律助理</b><small>演示回复 · 未调用模型</small></div><div class="assistant-body"><p class="analysis-trace">${I('checkcircle')}示例分析步骤：明确审查立场 → 梳理问题 → 形成建议</p><p>${a.intro}</p><div class="risk-summary">${I('info')}<div><strong>${a.summary}</strong><br><span>${a.note}</span></div></div><div class="risk-list">${a.items.map((x,i)=>`<div class="risk-row"><span class="risk-number">0${i+1}</span><div><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join('')}</div><button class="artifact-card" data-action="artifact" data-value="${index}"><span class="doc-icon">${I('file')}</span><span><strong>${a.title}</strong><small>演示文档 · 点击在右侧查看</small></span>${I('arrow-up-right')}</button><p class="muted" style="font-size:10px">以上基于虚构条款演示，未解析上传文件，也未检索现行法律。正式使用前需核验事实与法律依据。</p><div class="response-actions"><button class="icon-btn" data-action="copy-response" data-value="${index}" aria-label="复制回复" title="复制回复">${I('copy')}</button><button class="icon-btn" data-action="like" aria-label="标记有帮助" title="标记有帮助">${I('like')}</button><button class="text-btn" data-action="artifact" data-value="${index}" style="font-size:10px;margin-left:auto">查看工作产物 ${I('arrow-right')}</button></div>${index===state.messages.length-1?`<div class="followups"><button class="btn small" data-action="followup" data-value="请给出可供协商的条款修改方案。">给出条款修改方案 ${I('arrow-up-right')}</button><button class="btn small" data-page="${a.type==='evidence'?'evidence':a.type==='court'?'court':'signing'}">${a.type==='evidence'?'前往证据管理':a.type==='court'?'进入模拟法庭':'前往签署工作台'} ${I('arrow-up-right')}</button></div>`:''}</div>`;}).join('')}</div></div><div class="chat-bottom">${composer(true)}<div class="footer-note">演示环境 · AI 输出仅供参考，重要内容请由法律专业人员复核</div></div></section>${state.artifact?renderArtifact(r):''}</div>`;}
function renderArtifact(r){return `<aside class="artifact-panel"><div class="between"><h2 class="panel-title">工作产物</h2><button class="icon-btn" data-action="close-artifact" aria-label="关闭文档侧栏" title="关闭文档侧栏">${I('sidebar')}</button></div><div class="artifact-tabs"><button class="${state.artifactTab==='output'?'active':''}" data-action="artifact-tab" data-value="output">文档预览</button><button class="${state.artifactTab==='sources'?'active':''}" data-action="artifact-tab" data-value="sources">参考材料 <span class="tiny">2</span></button></div>${state.artifactTab==='output'?`<div class="paper"><div class="paper-header">JY PARALEGAL / WORK PRODUCT</div><h2>${r.title}</h2><div class="paper-meta">演示文档 · 2026.09.24 · 仅供内部审阅</div><h3>一、工作目标</h3><p>围绕当前法律事务，明确关键问题和待确认事项，形成可追踪的工作清单。</p><div class="highlight"><p>${r.summary}。请在对外使用前完成专业复核。</p></div>${r.items.map((x,i)=>`<h3>${i+2}、${x[0]}</h3><p>${x[1]}</p>`).join('')}<div class="paper-lines"><i></i><i></i><i></i></div></div><div class="between" style="margin-top:15px"><span class="tiny muted">文本演示 · 非正式法律意见</span><button class="btn small" data-action="download-report">${I('download')}导出</button></div>`:`<div class="source-card"><h3>${I('file')} 示例采购协议</h3><p>本 demo 内置的虚构条款片段，用于演示风险审查布局。未读取你的真实合同。</p></div><div class="source-card"><h3>${I('book')} 企业审查清单</h3><p>付款、验收与责任三个基础审查维度。并非真实知识库检索结果。</p></div><div class="info-strip amber">${I('info')}真实产品应显示来源文件、具体页码及可跳转的引用。</div>`}</aside>`;}
function stat(label,value,note,icon,unit=''){return `<div class="stat"><div class="stat-label">${I(icon)}${label}</div><div class="stat-value">${value}${unit?`<small>${unit}</small>`:''}</div><div class="stat-note">${note}</div></div>`;}
function heading(eyebrow,title,subtitle,buttons=''){return `<header class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${subtitle}</p></div>${buttons}</header>`;}
function renderOverview(){const c=counts();return `<div class="page">${heading('YOUR LEGAL WORKSPACE','每一项事务，都心中有数。','2026 年 9 月 24 日，星期四 · 这是你的示例工作概况',`<button class="btn" data-action="export-overview">${I('download')}导出工作摘要</button>`)}<div class="stats">${stat('签署任务',c.all,'当前空间的全部合同任务','files','份')}${stat('待处理签署',c.pending+c.waiting,`${c.pending} 份待我签署 · ${c.waiting} 份等待对方`,'clock','项')}${stat('证据材料',evidence.length,`${evidence.filter(x=>x.status==='pending').length} 份材料待核验`,'shield','份')}${stat('团队成员',members.length,'覆盖法务、人力与财务部门','users','人')}</div><div class="page-columns"><div><section class="panel" id="overview-todos"><div class="panel-head"><h2>需要你关注 <span class="pill amber" style="margin-left:7px">${c.pending+c.waiting}</span></h2><button class="text-btn" data-page="signing">全部任务 ${I('arrow-right')}</button></div><div class="panel-body">${signatures.filter(s=>['pending','waiting'].includes(s.status)).map(s=>`<div class="todo-row"><span class="todo-check">${I(s.status==='pending'?'pen':'clock')}</span><div class="grow"><strong>${s.title}</strong><p>${s.date} 截止 · ${s.company}</p></div><button class="btn small" data-action="open-sign" data-value="${s.id}">${s.status==='pending'?'去签署':'查看进度'}</button></div>`).join('')||'<div class="empty">全部待办已完成</div>'}</div></section><section class="panel" style="margin-top:22px"><div class="panel-head"><h2>常用工作流</h2><span class="tiny muted">让 AI 处理准备，让你专注判断</span></div><div class="panel-body" style="display:grid;grid-template-columns:1fr 1fr;gap:15px"><button class="knowledge-card" data-action="start-workflow" data-value="0" style="padding:18px">${I('file')}<h3>合同审查 → 签署</h3><p>风险识别 · 修订确认 · 发起签署</p></button><button class="knowledge-card" data-page="court" style="padding:18px">${I('scale')}<h3>证据梳理 → 庭审准备</h3><p>证据目录 · 争点分析 · 模拟演练</p></button></div></section></div><div><section class="panel"><div class="panel-head"><h2>近 7 日工作活动</h2><span class="tiny muted">示例数据</span></div><div class="panel-body"><div class="between"><span class="muted tiny">已完成的 AI 工作任务</span><strong style="color:var(--accent)">18 次</strong></div><div class="week-chart">${[2,3,1,0,4,3,5].map((v,i)=>`<div class="week-col"><b>${v}</b><div class="bar" style="height:${v*17+4}px"></div><span>9/${18+i}</span></div>`).join('')}</div></div></section><section class="panel" style="margin-top:22px"><div class="panel-head"><h2>近期动态</h2><button class="text-btn" data-action="audit">全部</button></div><div class="panel-body"><div class="timeline"><div class="timeline-item"><p>林一更新了采购合同审查意见</p><small>今天 10:32 · AI 对话</small></div><div class="timeline-item"><p>周宁上传了采购协议签署版</p><small>今天 09:18 · 证据管理</small></div><div class="timeline-item"><p>劳动合同已完成双方签署</p><small>9 月 22 日 · 签署工作台</small></div></div></div></section></div></div><div class="footer-note">本页数据均为虚构示例，新增及修改仅保留在当前页面会话中。</div></div>`;}
function signingRows(){const rows=signatures.filter(s=>(state.filter==='all'||s.status===state.filter)&&`${s.title}${s.company}`.includes(state.query));return rows.length?rows.map(s=>`<tr><td><div class="row"><span class="doc-icon">${I('file')}</span><div class="stack"><strong>${esc(s.title)}</strong><small>JY-202609-${String(s.id).padStart(3,'0')} · ${s.type}</small></div></div></td><td>${esc(s.company)}</td><td>${badge(s.status)}</td><td><div class="row"><span style="display:inline-flex"><span class="avatar" style="width:24px;height:24px;font-size:9px">${s.person}</span><span class="avatar blue" style="width:24px;height:24px;font-size:9px;margin-left:-6px">企</span></span><span class="tiny">${s.progress}</span></div></td><td>${s.date}</td><td><button class="text-btn" data-action="open-sign" data-value="${s.id}">${s.status==='pending'?'查看并签署':s.status==='draft'?'编辑草稿':'查看详情'} ${I('chevron')}</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">没有匹配的签署任务。试试其他名称或状态。</td></tr>';}
function renderSigning(){const c=counts();return `<div class="page">${heading('CONTRACT SIGNING','签署工作台','从发起到归档，让每一份合同都有清晰的进度。',`<div class="row"><button class="btn" data-action="export-signs">${I('download')}导出列表</button><button class="btn primary" data-action="new-sign">${I('plus')}新建签署</button></div>`)}<div class="stats">${stat('全部任务',c.all,'集中管理合同全生命周期','files')}${stat('待我签署',c.pending,'确认内容后即可处理','pen')}${stat('待他人签署',c.waiting,'随时查看签署进度','clock')}${stat('已完成',c.done,'签署文件可查阅与归档','checkcircle')}</div><div class="toolbar"><div class="segmented">${[['all','全部任务'],['pending','待我签署'],['waiting','待他人签署'],['done','已完成'],['draft','草稿']].map(x=>`<button class="${state.filter===x[0]?'active':''}" data-filter="${x[0]}">${x[1]}<span class="number">${c[x[0]]}</span></button>`).join('')}</div><label class="search-input">${I('search')}<input data-search="signing" value="${esc(state.query)}" placeholder="搜索合同名称、签署方" aria-label="搜索签署任务"></label></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>合同名称</th><th>签署方</th><th>状态</th><th>签署进度</th><th>截止日期</th><th>操作</th></tr></thead><tbody id="table-body">${signingRows()}</tbody></table></div><div class="table-footer"><span>当前空间共 ${c.all} 项任务</span><span>演示数据 · 不发起真实签署</span></div></section></div>`;}
function templateCards(){const rows=templates.filter(t=>(state.templateCategory==='全部模板'||t[1]===state.templateCategory)&&`${t[0]}${t[1]}`.includes(state.query));return rows.length?rows.map(t=>{const idx=templates.indexOf(t);return `<article class="template-card"><div class="template-top"><span class="doc-icon">${I('file')}</span><span class="pill ${t[3]==='推荐'?'':'gray'}">${t[3]}</span></div><h3>${t[0]}</h3><p>${t[2]}</p><div class="row" style="margin-top:15px"><span class="pill gray">${t[1]}</span><span class="tiny muted">示例范本</span></div><div class="template-bottom"><small>${t[4]} 更新</small><button class="text-btn" data-action="use-template" data-value="${idx}">使用模板 ${I('arrow-right')}</button></div></article>`;}).join(''):'<div class="empty">未找到匹配的模板</div>';}
function renderTemplates(){return `<div class="page">${heading('LEGAL TEMPLATES','好文书，从好范本开始。','沉淀企业标准条款，让每一次起草都有可靠的起点。',`<button class="btn primary" data-action="template-new">${I('plus')}起草新模板</button>`)}<div class="info-strip">${I('spark')}选择范本后，可交给法律助理根据交易背景、审阅立场与具体要求生成初稿。</div><div class="toolbar"><div class="segmented"><button class="active">${state.templateCategory}</button><button data-action="template-scope">企业示例模板 <span class="number">6</span></button></div><label class="search-input">${I('search')}<input data-search="templates" value="${esc(state.query)}" placeholder="搜索合同类型或名称" aria-label="搜索模板"></label></div><div class="template-grid" id="template-grid">${templateCards()}</div><div class="footer-note">以上为演示用的模板目录。合同内容需根据实际场景和现行法律调整。</div></div>`;}
function evidenceRows(){const rows=evidence.filter(e=>(state.filter==='all'||e.status===state.filter)&&`${e.name}${e.case}`.includes(state.query));return rows.length?rows.map(e=>`<tr><td><div class="row"><span class="doc-icon ${e.type==='交易凭证'?'amber':'blue'}">${I('file')}</span><div class="stack"><strong>${esc(e.name)}</strong><small>${e.type} · 示例文件</small></div></div></td><td>${e.case}</td><td><span class="pill ${e.status==='verified'?'':'amber'}">${I(e.status==='verified'?'checkcircle':'clock')}${e.status==='verified'?'已核验':'待核验'}</span></td><td class="mono" style="font-size:10px">${e.hash}</td><td>${e.date}</td><td><button class="text-btn" data-action="evidence-detail" data-value="${e.id}">查看 ${I('chevron')}</button></td></tr>`).join(''):'<tr><td class="empty" colspan="6">没有匹配的证据材料</td></tr>';}
function renderEvidence(){const verified=evidence.filter(e=>e.status==='verified').length;return `<div class="page">${heading('EVIDENCE MANAGEMENT','让每一份材料，有据可循。','关联事项、记录来源、核验内容，让材料管理更清晰。',`<div class="row"><button class="btn" data-action="export-evidence">${I('download')}导出目录</button><button class="btn primary" data-action="upload-evidence">${I('plus')}添加证据</button></div>`)}<div class="stats">${stat('全部证据',evidence.length,'集中归档，便于查阅','files','份')}${stat('已核验',verified,'示例核验状态','shield','份')}${stat('待核验',evidence.length-verified,'请确认文件来源与原始载体','clock','份')}${stat('关联事项','2','采购项目 · 法律顾问服务','folder','项')}</div><div class="toolbar"><div class="segmented">${[['all','全部证据'],['verified','已核验'],['pending','待核验']].map(x=>`<button class="${state.filter===x[0]?'active':''}" data-filter="${x[0]}">${x[1]}</button>`).join('')}</div><label class="search-input">${I('search')}<input data-search="evidence" value="${esc(state.query)}" placeholder="搜索证据或关联事项" aria-label="搜索证据"></label></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>证据名称</th><th>关联事项</th><th>核验状态</th><th>内容指纹（示例）</th><th>添加时间</th><th>操作</th></tr></thead><tbody id="table-body">${evidenceRows()}</tbody></table></div><div class="table-footer"><span>当前空间共 ${evidence.length} 份材料</span><span>核验记录不等同于证据司法认定</span></div></section><div class="info-strip amber" style="margin-top:20px">${I('info')}此 demo 仅演示证据管理交互，不进行真实存证、公证或司法认证，也不上传本地文件。</div></div>`;}
function renderCompany(){return `<div class="page">${heading('TEAM & ORGANIZATION','企业管理','让合适的人，在合适的权限下协同工作。',`<button class="btn primary" data-action="invite">${I('plus')}邀请成员</button>`)}<section class="company-header"><span class="company-logo">${I('building')}</span><div class="grow"><h2>远景科技（示例企业） <span class="pill gray" style="margin-left:7px">企业空间</span></h2><span class="tiny muted">${members.length} 位成员 <span style="margin:0 9px">·</span> 3 个部门 <span style="margin:0 9px">·</span> 团队版</span></div><button class="btn small" data-action="company-info">企业资料 ${I('chevron')}</button></section><div class="toolbar"><div class="segmented"><button class="active">全部成员 <span class="number">${members.length}</span></button><button data-action="departments">组织架构</button><button data-action="permissions">权限与角色</button></div><span class="tiny muted">角色修改仅作用于此演示会话</span></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>成员</th><th>所属部门</th><th>角色</th><th>最近活跃</th><th>状态</th></tr></thead><tbody>${members.map((m,i)=>`<tr><td><div class="row"><span class="avatar ${i%2?'blue':''}">${m.name[0]}</span><div class="stack"><strong>${esc(m.name)} ${i===0?'<span class="pill gray" style="font-size:8px">我</span>':''}</strong><small>${esc(m.email)}</small></div></div></td><td>${m.department}</td><td>${i===0?'管理员':`<select class="member-role" data-member="${i}" aria-label="${esc(m.name)}的角色">${['法务成员','普通成员','只读成员'].map(r=>`<option ${m.role===r?'selected':''}>${r}</option>`).join('')}</select>`}</td><td>${m.date}</td><td><span class="pill ${m.invited?'blue':''}"><span class="dot"></span>${m.invited?'待加入':'正常'}</span></td></tr>`).join('')}</tbody></table></div></section><div class="permission-grid">${[['shield','角色与权限','按岗位设置访问边界，避免不必要的敏感信息暴露。','permissions'],['pen','印章与授权','区分印章使用权限与文档审阅权限，明确责任主体。','seals'],['clock','操作可追溯','成员、签署与材料的关键操作，集中记录和回溯。','audit']].map(x=>`<button class="permission-card" data-action="${x[3]}" style="text-align:left">${I(x[0])}<h3>${x[1]}</h3><p>${x[2]}</p></button>`).join('')}</div></div>`;}
const courtPhases=['庭前准备','开庭陈述','法庭调查','法庭辩论','最后陈述','演练复盘'];
function renderCourt(){return `<div class="page">${heading('MOOT COURT','把准备，做在开庭之前。','采购合同纠纷 · 民事案件 · 你担任原告代理人',`<button class="btn" data-action="court-materials">${I('folder')}案件材料</button>`)}<div class="page-columns"><section><div class="steps">${courtPhases.map((x,i)=>`<div class="step ${i===state.court?'active':i<state.court?'done':''}"><span>${i<state.court?'✓':i+1}</span><p>${x}</p></div>`).join('')}</div><div class="court-stage"><div class="court-caption">JY PARALEGAL · 模拟庭审</div><div class="judge"><div class="role-icon">${I('scale')}</div><div class="desk"><strong>审判长</strong><small>AI 模拟角色</small></div></div><div class="court-parties"><div class="party-desk"><span class="avatar">林</span><div><strong>原告代理人</strong><small>林一 · 你</small></div></div><span class="court-vs">versus</span><div class="party-desk"><span class="avatar blue">AI</span><div><strong>被告代理人</strong><small>AI 模拟角色</small></div></div></div></div><div class="court-record"><div class="between"><strong>${state.court===0?'准备就绪，先确认案件事实':courtPhases[state.court]}</strong><span class="pill gray">示例流程</span></div><p>${['请先阅读材料，确认诉讼请求及其事实依据。此演示为固定脚本，不调用真实 AI，也不作裁判预测。','审判长：请原告代理人简要陈述诉讼请求、事实及理由。注意区分事实描述与法律评价。','审判长：请围绕合同约定、交付验收和付款记录分别举证，并说明每份材料的证明目的。','审判长：请围绕验收条件是否成就、迟延付款是否构成违约展开辩论，并回应对方主张。','审判长：请用简洁语言总结核心事实、关键证据与诉讼请求，避免引入未经质证的新材料。','演练结束。建议从事实完整性、证据关联性与表达条理三个维度复盘。本演示不提供真实能力评分。'][state.court]}</p></div></section><aside class="panel" style="align-self:start"><div class="panel-head"><h2>演练设置</h2><span class="pill gray">民事</span></div><div class="panel-body"><div class="form-group"><label class="form-label">案件名称</label><div class="field" style="font-size:11px;background:var(--warm)">采购合同纠纷（示例）</div></div><div class="form-group"><label class="form-label">我的角色</label><div class="field" style="font-size:11px;background:var(--warm)">原告代理人</div></div><div class="form-group"><label class="form-label">已关联材料</label><button class="artifact-card" data-action="court-materials" style="padding:11px;margin:0">${I('file')}<span class="tiny">合同及履行材料 · 3 份</span>${I('chevron')}</button></div><div class="form-group"><label class="form-label">准备提示</label><p style="font-size:11px;color:var(--muted);line-height:1.9">事实陈述要简明，证据与主张要对应。对不确定的信息明确保留，不把推断当作事实。</p></div><button class="btn primary" style="width:100%" data-action="court-next">${I(state.court===5?'refresh':'play')}${state.court===0?'开始演练':state.court===5?'重新演练':'进入下一阶段'}</button><button class="text-btn" style="display:flex;margin:15px auto 0;font-size:10px" data-action="court-report">查看演练说明 ${I('arrow-right')}</button></div></aside></div><div class="footer-note">庭审顺序为简化演示。实际程序以适用法律及法庭安排为准。</div></div>`;}
function renderKnowledge(){return `<div class="page">${heading('ORGANIZATION KNOWLEDGE','把经验，变成团队的共同资产。','按主题组织资料，在对话中引用，让每一次协作更有上下文。',`<button class="btn primary" data-action="knowledge-new">${I('plus')}新建资料库</button>`)}<div class="info-strip">${I('book')}在对话中可选择资料库作为参考。当前展示目录示例，没有连接真实检索服务。</div><div class="knowledge-grid">${[['企业合同范本','合同模板与企业审查标准，为起草和审查提供统一参考。','12 份文件','法务部'],['采购项目资料','集中管理年度采购协议、履约往来与相关业务材料。','8 份文件','项目空间'],['法律研究与案例','按主题整理研究笔记、适用规则和案例分析。','16 份文件','团队共享']].map((x,i)=>`<button class="knowledge-card" data-action="knowledge-detail" data-value="${i}">${I('book')}<h3>${x[0]}</h3><p>${x[1]}</p><footer><span>${x[2]} · 示例</span><span>${x[3]}</span></footer></button>`).join('')}</div></div>`;}
function renderSkills(){return `<div class="page">${heading('SKILLS & CONNECTORS','让专业能力，随需而至。','专家、技能与连接器各司其职，不再挤占你的工作界面。',`<button class="btn" data-action="skills-info">${I('info')}管理说明</button>`)}<div class="toolbar"><div class="segmented"><button class="active">精选能力</button><button data-action="connectors">连接器</button></div><span class="tiny muted">以下能力仅作 UI 演示</span></div><div class="knowledge-grid">${[['file','合同审查专家','从指定立场检查合同，输出风险清单与修订建议。','0'],['pen','法律文书起草','先确认业务条件，再形成结构清晰的文书初稿。','1'],['shield','证据目录整理','梳理证据来源、证明目的与待补充的关键材料。','2'],['scale','庭审策略助理','识别争议焦点，准备举证质证与庭审陈述。','3'],['book','企业知识库','在权限范围内引用组织资料，并保留来源。','knowledge'],['link','电子签署连接器','在用户确认后，将最终文档交接至签署流程。','signing']].map(x=>`<button class="knowledge-card" data-action="skill-use" data-value="${x[3]}">${I(x[0])}<h3>${x[1]}</h3><p>${x[2]}</p><footer><span>工作区能力</span><span>试用 ${I('arrow-up-right')}</span></footer></button>`).join('')}</div></div>`;}
let automationOn=true;
function renderAutomations(){return `<div class="page">${heading('SCHEDULED WORK','把重复的事，安排好。','提醒、摘要与例行整理，让日常工作更有秩序。',`<button class="btn primary" data-action="new-automation">${I('plus')}新建定时任务</button>`)}<div class="info-strip amber">${I('info')}仅演示任务配置；不会创建真实定时任务，不会发送通知或邮件。</div><section class="panel"><div class="panel-head"><div class="row">${I('clock')}<h2>每日待签署合同提醒</h2><span class="pill ${automationOn?'':'gray'}">${automationOn?'已启用（示例）':'已暂停'}</span></div><button class="switch ${automationOn?'on':''}" data-action="automation-toggle" role="switch" aria-checked="${automationOn}" aria-label="启用每日提醒"></button></div><div class="panel-body"><div class="detail-grid"><div><small>执行时间</small>每个工作日 09:00</div><div><small>任务内容</small>汇总待我签署及即将到期的合同</div><div><small>通知方式</small>工作台通知中心</div><div><small>执行范围</small>金元法务空间</div></div></div></section></div>`;}
function showDialog(title,body,footer='',wide=false){const d=$('#dialog');d.classList.toggle('wide',wide);d.innerHTML=`<header class="dialog-header"><h2 id="dialog-title">${title}</h2><button class="icon-btn" data-action="close-dialog" aria-label="关闭弹窗">${I('x')}</button></header><div class="dialog-body">${body}</div>${footer?`<footer class="dialog-footer">${footer}</footer>`:''}`;if(!d.open)d.showModal();hydrate(d);}
function closeDialog(){$('#dialog').close();}
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3200);}
function formFooter(label,form){return `<button class="btn" data-action="close-dialog">取消</button><button class="btn primary" type="submit" form="${form}">${label}</button>`;}
function showDesign(){showDialog('改版思路 · 安静、有序、以工作为中心',`<p class="lead">参考你提供的 Qoder 和 WorkBuddy 截图，保留清晰分区与低干扰工作区，不照搬通用助手的功能堆叠。重点解决现有界面中业务导航、会话与工具混在左侧，以及渐变和容器层级过多的问题。</p><div class="design-layout"><section class="design-box"><div class="eyebrow">01 / INFORMATION ARCHITECTURE</div><h3>顶部是业务，左侧是上下文</h3><p>七个业务 Tab 始终平铺、顺序固定。左栏随模块切换：对话页放工作空间和历史，签署页放任务状态，模板页放分类。不重复堆叠两套全局导航。</p></section><section class="design-box"><div class="eyebrow">02 / AI WORKSPACE</div><h3>先做事，再展示复杂能力</h3><p>新对话突出输入框和四个法律场景。进入会话后采用“对话 + 文档”双栏，过程、建议、产物与来源分层呈现。知识库、技能和定时任务移到辅助入口。</p></section><section class="design-box"><div class="eyebrow">03 / VISUAL LANGUAGE</div><h3>青绿、暖白，与克制的强调色</h3><p>取消蓝紫渐变大底；用背景层次和细分割线区分区域。主色只强调选中和关键动作，琥珀色提示待处理，正文回归高可读性。</p><div class="design-palette"><span style="background:#223d36"></span><span style="background:#347c64"></span><span style="background:#dcebe1"></span><span style="background:#f0f3ee"></span><span style="background:#fcfcf9"></span></div></section><section class="design-box"><div class="eyebrow">04 / BUSINESS CONSISTENCY</div><h3>管理页共享一套交互语法</h3><p>统一页标题、主操作、统计、筛选、表格与详情。签署、证据和企业管理采用一致的密度与状态标签，降低跨模块的学习成本。</p></section></div><div class="subhead">本轮已查看的重点参考</div><p class="lead" style="margin-bottom:0">Qoder：首页、会话界面、技能插件 MCP、常规设置。<br>WorkBuddy：助理、项目、输入框扩展菜单、资料库。<br><br>这是独立单文件 HTML，未修改现有业务前端。所有账号、文件、合同及回复均为演示；无真实 AI、签署、上传或外部通知调用。</p>`,`<button class="btn primary" data-action="close-dialog">开始体验</button>`,true);}
function showSettings(){showDialog('个人与工作区设置',`<div class="row" style="margin-bottom:22px"><span class="avatar" style="height:44px;width:44px;font-size:16px">林</span><div class="stack"><strong>林一</strong><span class="tiny muted">linyi@example.com · 示例账号</span></div><span class="pill gray" style="margin-left:auto">团队版</span></div><div class="settings-row"><div><strong>外观主题</strong><p>保留同一套层级，可切换强调色。</p></div><div class="swatches">${[['green','#347c64','青绿'],['blue','#577a9f','雾蓝'],['graphite','#5c6268','石墨']].map(x=>`<button class="swatch ${state.theme===x[0]?'active':''}" style="background:${x[1]}" data-action="theme" data-value="${x[0]}" aria-label="${x[2]}主题" title="${x[2]}"></button>`).join('')}</div></div><div class="settings-row"><div><strong>重要操作前确认</strong><p>签署与对外发送前，始终保留人工确认。</p></div><button class="switch on" disabled role="switch" aria-checked="true" aria-label="重要操作前确认，固定开启"></button></div><div class="settings-row"><div><strong>默认展开文档预览</strong><p>对话产生文档时，在右侧打开工作产物。</p></div><button class="switch ${state.artifact?'on':''}" data-action="setting-artifact" role="switch" aria-checked="${state.artifact}" aria-label="默认展开文档预览"></button></div><div class="settings-row"><div><strong>快捷键</strong><p>搜索 Ctrl + K · 新对话 Ctrl + J · 关闭弹窗 Esc</p></div>${I('grid')}</div><div class="info-strip" style="margin-top:23px;margin-bottom:0">${I('info')}偏好仅在当前演示会话生效，刷新页面会重置。</div>`,`<button class="btn primary" data-action="close-dialog">完成</button>`);}
function showSearch(query=''){const results=[...pages.map(p=>({title:p[1],sub:'业务模块',page:p[0]})),...signatures.map(s=>({title:s.title,sub:'签署任务 · '+statusMap[s.status][0],id:s.id})),{title:'知识库',sub:'工作区能力',page:'knowledge'},{title:'技能与连接器',sub:'工作区能力',page:'skills'}].filter(x=>x.title.toLowerCase().includes(query.toLowerCase()));return results.length?results.map(x=>`<button class="search-result" ${x.id?`data-action="search-sign" data-value="${x.id}"`:`data-action="search-page" data-value="${x.page}"`}>${I(x.id?'file':'grid')}<span><strong>${esc(x.title)}</strong><small>${esc(x.sub)}</small></span>${I('chevron')}</button>`).join(''):'<div class="empty">没有搜索结果</div>';}
function openSign(id){const s=signatures.find(x=>x.id===Number(id));if(!s)return;showDialog('签署详情',`<div class="between" style="margin-bottom:22px"><h2 style="font-size:18px">${esc(s.title)}</h2>${badge(s.status)}</div><div class="detail-grid"><div><small>任务编号</small>JY-202609-${String(s.id).padStart(3,'0')}</div><div><small>截止日期</small>${s.date}</div><div><small>签署方</small>${esc(s.company)}</div><div><small>签署进度</small>${s.progress}</div></div><div class="detail-block" style="margin-top:18px"><h3>合同文件</h3><div class="row"><span class="doc-icon">${I('file')}</span><div class="stack"><strong style="font-size:12px">${esc(s.title)}.pdf</strong><small class="muted">演示文档 · 不含真实合同正文</small></div><button class="text-btn" style="margin-left:auto" data-action="preview-contract" data-value="${s.id}">预览</button></div></div><div class="detail-block"><h3>流程记录</h3><p>${s.status==='draft'?'草稿已创建，尚未向签署方发出邀请。':s.status==='done'?'示例流程已完成，双方签署完成，文件已归档。':'任务已发起 → 等待各方确认 → 完成签署后归档。'}</p></div><div class="info-strip amber" style="margin:20px 0 0">${I('info')}此处只模拟状态变化，不产生法律效力，不发送真实签署邀请。</div>`,`<button class="btn" data-action="close-dialog">关闭</button>${s.status==='pending'?`<button class="btn primary" data-action="confirm-sign" data-value="${s.id}">${I('pen')}模拟我的签署</button>`:s.status==='waiting'?`<button class="btn primary" data-action="remind-sign" data-value="${s.id}">预览催签提醒</button>`:s.status==='draft'?`<button class="btn primary" data-action="draft-edit" data-value="${s.id}">编辑草稿</button>`:`<button class="btn primary" data-action="sign-receipt" data-value="${s.id}">${I('download')}导出示例记录</button>`}`);}
function newSign(existing){showDialog(existing?'编辑签署草稿':'新建签署任务',`<p class="lead">先准备合同名称、相对方与截止日期。本 demo 将创建一条本地草稿，不对外发送。</p><form id="sign-form"><input type="hidden" name="id" value="${existing?.id||''}"><div class="form-group"><label class="form-label" for="contract-title">合同名称 *</label><input class="field" id="contract-title" name="title" value="${esc(existing?.title||'')}" required maxlength="70" placeholder="例如：年度采购框架协议"></div><div class="form-group"><label class="form-label" for="counterparty">相对方名称 *</label><input class="field" id="counterparty" name="company" value="${esc(existing?.company.split(' × ')[1]||'')}" required maxlength="60" placeholder="请输入签署企业名称"></div><div class="form-grid"><div class="form-group"><label class="form-label" for="contract-type">合同类型</label><select class="field" name="type" id="contract-type">${['采购合同','服务合同','保密协议','劳动用工','技术合同','房屋租赁'].map(t=>`<option ${existing?.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="form-group"><label class="form-label" for="contract-date">截止日期 *</label><input class="field" id="contract-date" name="date" type="date" required value="${existing?.date&&existing.date!=='未设置'?existing.date:'2026-09-30'}"></div></div><div class="info-strip" style="margin:0">${I('shield')}真实产品中，下一步将配置合同文件、签署人和签署位置。</div></form>`,formFooter('保存为草稿','sign-form'));}
function openEvidence(id){const e=evidence.find(x=>x.id===Number(id));if(!e)return;showDialog('证据详情',`<div class="row" style="margin-bottom:23px"><span class="doc-icon blue">${I('file')}</span><h2 style="font-size:14px;overflow-wrap:anywhere">${esc(e.name)}</h2></div><div class="detail-grid"><div><small>材料类型</small>${e.type}</div><div><small>关联事项</small>${e.case}</div><div><small>核验状态</small>${e.status==='verified'?'已核验（示例）':'待核验'}</div><div><small>添加时间</small>${e.date}</div></div><div class="detail-block" style="margin-top:17px"><h3>来源记录</h3><p>示例：由项目成员整理后加入工作空间，供法务审阅。真实产品应记录上传人、原始来源、采集方式与时间。</p></div><div class="detail-block"><h3>内容指纹</h3><p class="mono">${e.hash}</p><p>仅为示例显示，不是真实文件哈希或存证凭据。</p></div><div class="info-strip amber" style="margin:18px 0 0">${I('info')}核验仅表示材料管理状态，不等同于司法确认或真实性认定。</div>`,`<button class="btn" data-action="close-dialog">关闭</button>${e.status==='pending'?`<button class="btn primary" data-action="verify-evidence" data-value="${e.id}">模拟完成核验</button>`:`<button class="btn primary" data-action="export-one-evidence" data-value="${e.id}">导出示例信息</button>`}`);}
function exportText(filename,text,type='text/plain;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type}));a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已导出示例文件');}
function exportCSV(filename,rows){const safe=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};exportText(filename,rows.map(r=>r.map(safe).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function updateSend(){const send=$('#send-btn');if(send)send.disabled=!$('#message-input').value.trim();}
function startChat(prompt){if(!prompt.trim())return;state.draft='';state.prompt=prompt;state.chat=true;state.page='chat';state.messages.push({prompt});state.activeArtifact=state.messages.length-1;state.attachments=[];render();$('#message-input').focus({preventScroll:true});}
function fillPrompt(prompt){if(state.page!=='chat')navigate('chat');state.draft=prompt;$('#message-input').value=prompt;$('#message-input').focus();updateSend();}
function history(index){const prompts=[starterPrompts[0],'请帮我起草新员工陈明的劳动合同，先列出岗位、薪资、工时及试用期等需要确认的信息。',starterPrompts[2],'请检查这份保密协议的条款，梳理保密范围、期限和例外情形，并给出修改建议。'];state.messages=[];state.chat=false;state.artifact=true;startChat(prompts[Number(index)]||prompts[0]);}
function theme(value){state.theme=value;const vars=value==='blue'?{'--ink':'#2e4051','--text':'#3b4b5b','--accent':'#577a9f','--accent-hover':'#456788','--tint':'#eaf0f6','--tint-strong':'#dfe9f3','--sidebar':'#eef2f6','--canvas':'#fafbfd'}:value==='graphite'?{'--ink':'#303639','--text':'#4b5153','--accent':'#5c6268','--accent-hover':'#454a50','--tint':'#eceeef','--tint-strong':'#e1e4e6','--sidebar':'#f1f2f3','--canvas':'#fbfbfa'}:{'--ink':'#223d36','--text':'#34463f','--accent':'#347c64','--accent-hover':'#28674f','--tint':'#e9f2ec','--tint-strong':'#dcebe1','--sidebar':'#f0f3ee','--canvas':'#fcfcf9'};Object.entries(vars).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));showSettings();}
function details(title,text){showDialog(title,`<p class="lead" style="margin:0">${text}</p>`,`<button class="btn primary" data-action="close-dialog">知道了</button>`);}
document.addEventListener('click',async event=>{
const b=event.target.closest('button');if(!b||b.disabled)return;
if(b.dataset.page){navigate(b.dataset.page);return;}
if(b.dataset.filter){state.filter=b.dataset.filter;state.query='';render();return;}
if(b.dataset.category){state.templateCategory=b.dataset.category;state.query='';render();return;}
const action=b.dataset.action,v=b.dataset.value;
switch(action){
case 'design':showDesign();break;
case 'settings':showSettings();break;
case 'close-dialog':closeDialog();break;
case 'sidebar':$('#sidebar').classList.toggle('open');break;
case 'theme':theme(v);break;
case 'setting-artifact':state.artifact=!state.artifact;render();showSettings();break;
case 'search':showDialog('搜索工作空间',`<label class="search-input" style="width:100%">${I('search')}<input id="global-search" placeholder="搜索模块、合同与工作记录…" aria-label="全局搜索关键词" autofocus></label><div class="search-results" id="search-results">${showSearch()}</div>`);$('#global-search').focus();break;
case 'search-page':closeDialog();navigate(v);break;
case 'search-sign':openSign(v);break;
case 'new-chat':state.chat=false;state.messages=[];state.attachments=[];state.draft='';navigate('chat');$('#message-input').focus();break;
case 'starter':fillPrompt(starterPrompts[Number(v)]);break;
case 'history':history(v);break;
case 'start-workflow':history(v);break;
case 'send':startChat($('#message-input').value);break;
case 'followup':fillPrompt(v);break;
case 'attach':$('#file-input').dataset.purpose='chat';$('#file-input').click();break;
case 'remove-attachment':state.attachments.splice(Number(v),1);render();break;
case 'artifact':state.artifact=true;state.artifactTab='output';if(v!==undefined)state.activeArtifact=Number(v);render();break;
case 'close-artifact':state.artifact=false;render();break;
case 'artifact-tab':state.artifactTab=v;render();break;
case 'copy-response':{const r=responseFor(state.messages[Number(v)].prompt);const text=r.intro+'\n'+r.items.map(x=>x.join('：')).join('\n')+'\n演示回复，非正式法律意见。';try{await navigator.clipboard.writeText(text);toast('已复制演示回复');}catch{showDialog('复制回复',`<textarea class="field" rows="9" readonly aria-label="回复文本">${esc(text)}</textarea>`,`<button class="btn primary" data-action="close-dialog">完成</button>`);}break;}
case 'like':b.style.color='var(--accent)';b.setAttribute('aria-pressed','true');toast('已标记为有帮助（仅本地演示）');break;
case 'download-report':{const r=responseFor(state.messages[state.activeArtifact].prompt);exportText('JY-工作产物-演示.txt',r.title+'\n演示文档，不构成法律意见\n\n'+r.intro+'\n\n'+r.items.map((x,i)=>`${i+1}. ${x[0]}\n${x[1]}`).join('\n\n'));break;}
case 'workspace':showDialog('切换工作空间',`<p class="lead">工作空间承载企业资料、项目和会话。本 demo 切换名称以预览上下文，不连接真实租户。</p>${['金元法务空间','个人工作空间'].map(x=>`<button class="search-result" data-action="select-workspace" data-value="${x}">${I(x==='个人工作空间'?'user':'building')}<span class="grow"><strong>${x}</strong><small>${x==='个人工作空间'?'私人草稿与研究':'团队共享资料与业务任务'}</small></span>${state.workspace===x?I('check'):I('chevron')}</button>`).join('')}`);break;
case 'select-workspace':state.workspace=v;closeDialog();render();toast('已切换展示名称；仍为同一组演示数据');break;
case 'all-chats':showDialog('全部对话',`<p class="lead">以下为示例工作记录。点击可体验对话与产物双栏。</p>${['采购框架协议 · 风险审查','新员工劳动合同起草','供应商违约证据梳理','保密协议条款修改'].map((x,i)=>`<button class="search-result" data-action="open-history" data-value="${i}">${I('chat')}<span><strong>${x}</strong><small>金元法务空间 · 示例记录</small></span>${I('chevron')}</button>`).join('')}`);break;
case 'open-history':closeDialog();history(v);break;
case 'project':showDialog(esc(v),`<p class="lead">项目空间将相关对话、文件与事项归在一起。</p><button class="search-result" data-action="open-history" data-value="0">${I('chat')}<span><strong>采购框架协议 · 风险审查</strong><small>查看对话和审查产物</small></span>${I('chevron')}</button><button class="search-result" data-action="search-page" data-value="evidence">${I('shield')}<span><strong>相关证据材料</strong><small>查看项目材料目录</small></span>${I('chevron')}</button>`);break;
case 'notifications':showDialog('通知中心',notificationContent());break;
case 'new-sign':newSign();break;
case 'open-sign':openSign(v);break;
case 'draft-edit':newSign(signatures.find(x=>x.id===Number(v)));break;
case 'confirm-sign':{const s=signatures.find(x=>x.id===Number(v));showDialog('确认模拟签署',`<p class="lead">你将对“${esc(s.title)}”模拟完成自己的签署。不会调用电子签服务，也不会产生法律效力。</p><div class="info-strip amber" style="margin:0">${I('shield')}真实签署流程应包括身份认证、授权校验、合同完整展示及明确的签署意愿确认。</div>`,`<button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="complete-sign" data-value="${v}">确认模拟签署</button>`);break;}
case 'complete-sign':{const s=signatures.find(x=>x.id===Number(v));const current=Number(s.progress.split('/')[0].trim())+1;s.progress=current+' / 2';s.status=current===2?'done':'waiting';closeDialog();render();toast(current===2?'模拟签署完成，双方已签署':'已模拟完成你的签署，等待另一方');break;}
case 'remind-sign':{const s=signatures.find(x=>x.id===Number(v));showDialog('催签提醒预览',`<p class="lead">以下为提醒文案预览，demo 不发送消息。</p><div class="paper" style="min-height:auto"><p style="font-size:12px">您好，“${esc(s.title)}”仍待您确认签署。计划截止日期为 ${s.date}，请核实内容后处理；如有疑问，请联系发起人。</p></div>`,`<button class="btn primary" data-action="close-dialog">完成预览</button>`);break;}
case 'preview-contract':{const s=signatures.find(x=>x.id===Number(v));showDialog('合同预览 · 示意',`<div class="paper"><div class="paper-header">CONTRACT PREVIEW · DEMO</div><h2>${esc(s.title)}</h2><div class="paper-meta">以下为虚构片段，非完整合同，不得直接用于签署</div><h3>第一条 合作事项</h3><p>双方根据实际业务需求确认合作范围、交付内容与履行要求。</p><h3>第二条 交付与验收</h3><p>双方应进一步明确质量标准、验收程序、异议期限及处理方式。</p><h3>第三条 付款与责任</h3><p>付款节点、责任承担和争议解决方式，由双方结合交易背景另行约定。</p></div>`,`<button class="btn" data-action="open-sign" data-value="${s.id}">返回任务</button>`);break;}
case 'sign-receipt':{const s=signatures.find(x=>x.id===Number(v));exportText('签署记录-演示.txt',`此为演示记录，不构成签署证书或法律凭据。\n任务：${s.title}\n状态：${statusMap[s.status][0]}\n签署进度：${s.progress}`);break;}
case 'export-signs':exportCSV('签署任务-示例.csv',[['合同名称','签署方','状态','截止日期'],...signatures.map(s=>[s.title,s.company,statusMap[s.status][0],s.date])]);break;
case 'use-template':{const t=templates[Number(v)];showDialog(t[0]+' · 模板预览',`<p class="lead">${t[2]} 以下仅展示结构。使用前应依据实际交易、履行安排和适用法律进行调整。</p><div class="paper" style="min-height:220px"><div class="paper-header">LEGAL TEMPLATE / SAMPLE</div><h2>${t[0]}</h2><h3>一、合同主体与合作事项</h3><p>确认各方主体信息与合同目的，补全核心业务约定。</p><h3>二、权利义务与履行安排</h3><p>根据实际交易确认履行内容、时间节点及责任边界。</p><h3>三、争议解决与其他条款</h3><p>由专业人员结合具体场景审阅，并由有权限的人员确认。</p></div>`,`<button class="btn" data-action="close-dialog">关闭</button><button class="btn primary" data-action="template-to-chat" data-value="${v}">${I('spark')}交给 AI 起草</button>`);break;}
case 'template-to-chat':closeDialog();state.chat=false;state.messages=[];navigate('chat');fillPrompt(`请参考“${templates[Number(v)][0]}”起草一份合同初稿，先向我确认主体信息、合作内容与核心条款。`);break;
case 'template-new':state.chat=false;state.messages=[];navigate('chat');fillPrompt('我想起草一份企业合同模板，请先帮我确认使用场景、各方主体、审阅立场与必要条款。');break;
case 'template-scope':details('企业示例模板','本演示共 6 个模板目录，均为虚构的工作区模板。左侧可按合同类别筛选。正式产品可在此区分企业自建、平台范本与个人收藏。');break;
case 'evidence-project':state.filter='all';state.query=v;render();break;
case 'evidence-detail':openEvidence(v);break;
case 'verify-evidence':showDialog('核验操作演示',`<p class="lead">请先核对材料来源、原始文件及采集记录。此 demo 仅改变标签，不计算内容指纹，也不证明真实性。</p>`,`<button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="complete-verify" data-value="${v}">标记为已核验（示例）</button>`);break;
case 'complete-verify':{const e=evidence.find(x=>x.id===Number(v));e.status='verified';e.hash='演示核验 · 未计算';closeDialog();render();toast('已更新演示核验状态');break;}
case 'export-evidence':exportCSV('证据目录-示例.csv',[['证据名称','类型','关联事项','状态','指纹（仅示例）'],...evidence.map(e=>[e.name,e.type,e.case,e.status==='verified'?'已核验（示例）':'待核验',e.hash])]);break;
case 'export-one-evidence':{const e=evidence.find(x=>x.id===Number(v));exportText('证据信息-示例.txt',`仅为演示，不构成存证凭据\n名称：${e.name}\n关联事项：${e.case}\n内容指纹（示例）：${e.hash}`);break;}
case 'upload-evidence':showDialog('添加证据材料',`<p class="lead">选择文件后仅记录文件名，不读取或上传文件内容。用于演示待核验队列。</p><button class="upload-zone" data-action="pick-evidence">${I('upload')}<strong>点击选择本地文件</strong><small>PDF / Word / 图片 / 文本 · 仅展示名称</small></button><div class="info-strip" style="margin-top:20px;margin-bottom:0">${I('folder')}新材料默认关联“年度采购项目”。</div>`,`<button class="btn" data-action="close-dialog">取消</button>`);break;
case 'pick-evidence':$('#file-input').dataset.purpose='evidence';$('#file-input').click();break;
case 'invite':showDialog('邀请企业成员',`<p class="lead">填写成员信息以预览邀请流程。本 demo 只生成本地待加入记录，不发送邮件。</p><form id="invite-form"><div class="form-group"><label class="form-label" for="invite-name">姓名 *</label><input class="field" id="invite-name" name="name" required maxlength="30" placeholder="成员姓名"></div><div class="form-group"><label class="form-label" for="invite-email">邮箱 *</label><input class="field" id="invite-email" name="email" type="email" required placeholder="member@example.com"></div><div class="form-grid"><div class="form-group"><label class="form-label" for="invite-department">所属部门</label><select class="field" name="department" id="invite-department"><option>法务部</option><option>人力资源部</option><option>财务部</option></select></div><div class="form-group"><label class="form-label" for="invite-role">成员角色</label><select class="field" name="role" id="invite-role"><option>普通成员</option><option>法务成员</option><option>只读成员</option></select></div></div></form>`,formFooter('创建演示邀请','invite-form'));break;
case 'company-view':navigate('company');break;
case 'departments':showDialog('部门架构',`<div class="knowledge-grid" style="grid-template-columns:1fr">${['法务部','人力资源部','财务部'].map(d=>`<section class="notification-card" style="margin:0"><h3>${I('building')} ${d}</h3><p style="margin:0">${members.filter(m=>m.department===d).map(m=>esc(m.name)).join('、')} · ${members.filter(m=>m.department===d).length} 位成员</p></section>`).join('')}</div>`);break;
case 'permissions':showDialog('权限与角色',`<p class="lead">按职责分配权限，重要操作单独授权。以下为 UI 方案中的权限分层，不修改现有系统权限。</p>${[['管理员','管理企业资料、成员和角色；关键签署与用印仍需明确授权。'],['法务成员','处理授权范围内的合同、证据和专业工作任务。'],['普通成员','访问分配给自己的业务事项和团队共享资料。'],['只读成员','仅查看被授权的信息，不进行编辑或业务操作。']].map(x=>`<div class="detail-block"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}`);break;
case 'seals':details('印章与授权','本演示未接入印章服务。建议真实页面独立展示“印章主体、使用范围、被授权人、有效期与审批记录”，不要把合同阅读权限直接等同于用印权限。');break;
case 'company-info':showDialog('企业资料',`<div class="detail-grid"><div><small>企业名称</small>远景科技（示例企业）</div><div><small>空间名称</small>${esc(state.workspace)}</div><div><small>统一社会信用代码</small>未提供 · 演示环境</div><div><small>认证状态</small>未进行真实认证</div><div><small>工作部门</small>法务部 / 人力资源部 / 财务部</div><div><small>当前管理员</small>林一（示例账号）</div></div>`,`<button class="btn primary" data-action="close-dialog">完成</button>`);break;
case 'audit':showDialog('操作日志 · 示例',`<div class="timeline"><div class="timeline-item"><p>2026-09-24 10:32 · 林一更新合同审查意见</p><small>对象：年度采购框架协议</small></div><div class="timeline-item"><p>2026-09-24 09:18 · 周宁添加证据材料</p><small>对象：采购协议签署版</small></div><div class="timeline-item"><p>2026-09-22 16:40 · 劳动合同完成签署</p><small>对象：劳动合同 · 陈明</small></div></div><div class="info-strip" style="margin:25px 0 0">${I('info')}固定的示例日志，不是实际操作审计记录。</div>`);break;
case 'overview-todos':$('#overview-todos')?.scrollIntoView({behavior:'smooth'});break;
case 'export-overview':{const c=counts();exportText('工作摘要-示例.txt',`金元法务空间 · 示例工作摘要\n全部签署任务：${c.all}\n待处理：${c.pending+c.waiting}\n证据材料：${evidence.length}\n团队成员：${members.length}\n\n所有数据均为虚构演示。`);break;}
case 'court-next':state.court=(state.court+1)%6;render();break;
case 'court-current':navigate('court');break;
case 'new-court':showDialog('新建庭审演练',`<p class="lead">本轮 demo 内置“采购合同纠纷”一个示例案件。你可以重新开始六阶段流程，或先在 Agent 对话中准备其他案件的提纲。</p>`,`<button class="btn" data-action="court-draft">先准备案件提纲</button><button class="btn primary" data-action="court-reset">重新开始示例</button>`);break;
case 'court-reset':state.court=0;closeDialog();navigate('court');break;
case 'court-draft':closeDialog();navigate('chat');fillPrompt(starterPrompts[3]);break;
case 'court-materials':showDialog('案件材料 · 采购合同纠纷',`<p class="lead">虚构的准备材料目录，用于演示法庭工作区。</p>${[['采购协议','证明合同主体及约定的权利义务'],['交付及验收记录','说明交付过程及验收争议'],['付款记录与催告邮件','说明付款时间、金额及沟通过程']].map(x=>`<div class="detail-block"><div class="row">${I('file')}<div><h3>${x[0]}</h3><p>${x[1]}</p></div></div></div>`).join('')}`);break;
case 'court-roles':details('角色设置','本示例中，你担任原告代理人；审判长与被告代理人为脚本模拟角色。真实产品可在此选择己方角色、AI 对手风格及参与人员，先完成案件材料授权再开始。');break;
case 'court-report':showDialog('演练复盘',`<p class="lead">当前进度：${courtPhases[state.court]}。本 demo 仅用于检查流程与布局，不评估个人专业能力。</p>${[['事实完整性','是否清晰区分诉请、事实、推断与待证事项？'],['证据关联性','是否为关键主张提供对应材料，并说明证明目的？'],['表达与回应','是否简洁回应争议焦点及对方论点？']].map(x=>`<div class="detail-block"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}`,`<button class="btn primary" data-action="close-dialog">返回演练</button>`);break;
case 'knowledge-new':details('新建资料库 · 交互方案','真实产品中应先填写资料库名称、说明和访问范围，再添加来源文件。本 demo 没有后端存储，不创建真实资料库。你可以打开示例资料库，体验“选资料 → 带入对话”的路径。');break;
case 'knowledge-detail':showDialog(['企业合同范本','采购项目资料','法律研究与案例'][Number(v)],`<p class="lead">这是资料库目录示例，不包含真实企业文件。</p>${['标准采购协议.pdf','合同审查工作清单.pdf','条款修订记录.txt'].map(x=>`<div class="detail-block"><div class="row">${I('file')}<span style="font-size:12px">${x}</span><span class="pill gray" style="margin-left:auto">示例资料</span></div></div>`).join('')}`,`<button class="btn" data-action="close-dialog">关闭</button><button class="btn primary" data-action="knowledge-chat">在对话中使用</button>`);break;
case 'knowledge-chat':closeDialog();navigate('chat');fillPrompt('请参考企业合同范本与审查清单，帮我梳理采购协议审查时需要重点关注的问题。');break;
case 'skill-use':if(v==='knowledge'||v==='signing')navigate(v);else{navigate('chat');fillPrompt(starterPrompts[Number(v)]);}break;
case 'skills-info':details('能力中心管理','专家负责专业视角，技能负责具体工作流，连接器负责外部系统接口。建议三类能力集中管理，按需挂载到当前对话，不增加顶部业务 Tab。当前卡片均为交互示意。');break;
case 'connectors':showDialog('连接器',`<p class="lead">以下为集成入口示意，均未连接外部服务。</p>${[['电子签署','签署流程、签署方与完成回调'],['企业知识库','资料检索与引用来源'],['企业通讯工具','任务通知与协作提醒']].map(x=>`<div class="settings-row"><div><strong>${x[0]}</strong><p>${x[1]}</p></div><span class="pill gray">未连接</span></div>`).join('')}`);break;
case 'automation-toggle':automationOn=!automationOn;render();toast(automationOn?'已启用展示状态，不执行真实任务':'已暂停展示状态');break;
case 'new-automation':showDialog('新建定时任务 · 配置预览',`<p class="lead">设置任务意图和执行时间。此处仅预览配置，不创建或执行真实任务。</p><form id="automation-form"><div class="form-group"><label class="form-label" for="automation-name">任务名称 *</label><input class="field" id="automation-name" name="name" required maxlength="50" placeholder="例如：每周法务工作摘要"></div><div class="form-group"><label class="form-label" for="automation-time">执行时间</label><input class="field" type="time" id="automation-time" name="time" value="09:00" required></div><div class="form-group"><label class="form-label" for="automation-prompt">任务说明 *</label><textarea class="field" id="automation-prompt" name="prompt" required maxlength="500" placeholder="描述你希望自动整理的内容"></textarea></div></form>`,formFooter('预览配置','automation-form'));break;
}
});
document.addEventListener('input',event=>{
const el=event.target;
if(el.id==='message-input'){state.draft=el.value;updateSend();}
if(el.id==='global-search')$('#search-results').innerHTML=showSearch(el.value);
if(el.dataset.search){state.query=el.value;if(el.dataset.search==='signing')$('#table-body').innerHTML=signingRows();if(el.dataset.search==='evidence')$('#table-body').innerHTML=evidenceRows();if(el.dataset.search==='templates')$('#template-grid').innerHTML=templateCards();}
});
document.addEventListener('change',event=>{
const el=event.target;
if(el.id==='mode'){state.mode=el.value;toast('已选择'+el.value+'；回复仍为固定演示内容');}
if(el.id==='model'){state.model=el.value;toast('已选择模型展示项，未连接真实模型');}
if(el.id==='specialist'){state.specialist=el.value;toast('已选择'+el.value+'（演示）');}
if(el.dataset.member){members[Number(el.dataset.member)].role=el.value;toast('已更新演示角色，不影响真实权限');}
if(el.id==='file-input'){
const files=Array.from(el.files);
if(el.dataset.purpose==='evidence'&&files.length){files.forEach(f=>evidence.push({id:Math.max(...evidence.map(e=>e.id))+1,name:f.name,type:'本地文件',case:'年度采购项目',status:'pending',date:'刚刚',hash:'未计算'}));closeDialog();navigate('evidence');toast(`已加入 ${files.length} 个文件名称；未读取或上传内容`);}
else if(files.length){state.attachments.push(...files.map(f=>({name:f.name,size:f.size})));render();toast('仅添加文件名称，demo 不解析文件内容');}
el.value='';
}
});
document.addEventListener('submit',event=>{
event.preventDefault();const form=event.target;const data=new FormData(form);
if(form.getAttribute('id')==='sign-form'){
const title=String(data.get('title')).trim(),company=String(data.get('company')).trim();if(!title||!company){toast('请填写有效的合同名称和相对方');return;}
const id=Number(data.get('id'));const existing=signatures.find(x=>x.id===id);
if(existing){existing.title=title;existing.company='远景科技 × '+company;existing.date=data.get('date');existing.type=data.get('type');}
else signatures.unshift({id:Math.max(...signatures.map(s=>s.id))+1,title,company:'远景科技 × '+company,status:'draft',date:data.get('date'),progress:'0 / 2',person:'林',type:data.get('type')});
closeDialog();navigate('signing');state.filter='draft';render();toast('草稿已保存在本次演示中，未发送邀请');
}
if(form.getAttribute('id')==='invite-form'){
const name=String(data.get('name')).trim();if(!name){toast('请填写有效姓名');return;}
const email=String(data.get('email')).trim();if(members.some(m=>m.email===email)){toast('该邮箱已存在于示例成员中');return;}
members.push({name,email,department:data.get('department'),role:data.get('role'),date:'尚未加入',invited:true});closeDialog();navigate('company');toast('已创建本地待加入记录，未发送邮件');
}
if(form.getAttribute('id')==='automation-form')showDialog('定时任务配置预览',`<div class="detail-block"><h3>任务名称</h3><p>${esc(data.get('name'))}</p></div><div class="detail-block"><h3>计划时间</h3><p>每天 ${esc(data.get('time'))}</p></div><div class="detail-block"><h3>任务说明</h3><p>${esc(data.get('prompt'))}</p></div><div class="info-strip amber" style="margin:20px 0 0">${I('info')}配置仅供预览，没有保存至调度系统，不会执行。</div>`,`<button class="btn primary" data-action="close-dialog">完成预览</button>`);
});
document.addEventListener('keydown',event=>{
if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();document.querySelector('[data-action="search"]').click();}
if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='j'){event.preventDefault();if($('#dialog').open)closeDialog();state.chat=false;state.messages=[];state.draft='';state.attachments=[];navigate('chat');$('#message-input').focus();}
if(event.target.id==='message-input'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();startChat(event.target.value);}
});
$('#dialog').addEventListener('click',event=>{if(event.target===$('#dialog')){const rect=$('#dialog').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeDialog();}});
$('#brand-logo').innerHTML=logo;
render();
</script>
</body>
</html>
